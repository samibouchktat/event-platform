spring.application.name=event-platform-backend

server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/event_platform_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin123}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

app.frontend.url=${FRONTEND_URL:http://localhost:5173}
# JWT
app.jwt.secret=${JWT_SECRET:change_me_with_a_strong_secret_key_for_dev_only_123456789}
#expiraation apres 24 h
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}